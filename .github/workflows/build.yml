name: Build Mod

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build with Gradle
        run: gradle build
      - name: Upload Mod Jar
        uses: actions/upload-artifact@v3
        with:
          name: AutoBuilder-Mod
          path: build/libs/*.jar

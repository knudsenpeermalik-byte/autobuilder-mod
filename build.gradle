plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
}

version = "1.0.0"
group = "com.example.autobuilder"

repositories {
    maven { url 'https://masa.dy.fi/mcmods/maven/' }
    maven { url 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.21"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.83.0+1.20.1"

    modImplementation "fi.dy.masa.malilib:malilib-fabric-1.20.1:0.16.0"
    modImplementation "fi.dy.masa.litematica:litematica-fabric-1.20.1:0.14.1"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
